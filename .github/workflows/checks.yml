name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: compile · unit · build · stand (headless real Chromium)
        run: npm run gates
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stand-proof
          path: test-results/
          retention-days: 14
